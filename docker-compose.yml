services:
  api:
    build: .
    ports:
      - "8083:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=todos;Username=todo;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: