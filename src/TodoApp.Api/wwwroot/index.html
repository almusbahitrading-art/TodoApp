<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قائمة المهام</title>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>قائمة المهام</h1>

  <form id="form">
    <input id="title" placeholder="مهمة جديدة..." required>
    <button>إضافة</button>
  </form>

  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const titleInput = document.getElementById('title');

    async function load() {
      const res = await fetch('/api/todos');
      const todos = await res.json();
      list.innerHTML = '';
      for (const t of todos) {
        const li = document.createElement('li');
        if (t.isDone) li.className = 'done';

        const span = document.createElement('span');
        span.textContent = t.title;
        span.onclick = async () => {
          await fetch(`/api/todos/${t.id}/toggle`, { method: 'PUT' });
          load();
        };

        const del = document.createElement('button');
        del.textContent = 'حذف';
        del.onclick = async () => {
          await fetch(`/api/todos/${t.id}`, { method: 'DELETE' });
          load();
        };

        li.append(span, del);
        list.append(li);
      }
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: titleInput.value })
      });
      titleInput.value = '';
      load();
    };

    load();
  </script>
</body>
</html>
